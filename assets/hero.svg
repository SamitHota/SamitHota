<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="SamitHota - Security Engineer and Software Developer">
  <defs>
    <!-- CRT scanline texture -->
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect width="4" height="1" fill="#00ff41" opacity="0.055"/>
    </pattern>

    <!-- vertical glow trailing the scan bar -->
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#00ff41" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.38"/>
    </linearGradient>

    <!-- faint horizon glow behind the title -->
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing reveals: each clip widens on a shared 13s loop -->
    <clipPath id="t1"><rect x="40" y="160" width="0" height="26">
      <animate attributeName="width" values="0;0;327;327;0" keyTimes="0;0.05;0.17;0.94;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="40" y="194" width="0" height="26">
      <animate attributeName="width" values="0;0;356;356;0" keyTimes="0;0.19;0.34;0.94;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="40" y="228" width="0" height="26">
      <animate attributeName="width" values="0;0;298;298;0" keyTimes="0;0.36;0.47;0.94;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t4"><rect x="40" y="262" width="0" height="26">
      <animate attributeName="width" values="0;0;625;625;0" keyTimes="0;0.49;0.66;0.94;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- ── black canvas ── -->
  <rect width="1000" height="340" fill="#000000"/>
  <ellipse cx="500" cy="95" rx="430" ry="120" fill="url(#bloom)"/>

  <!-- ── masthead ── -->
  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace">
    <text x="40" y="92" font-size="58" font-weight="700" fill="#00ff41" filter="url(#glow)" letter-spacing="1">SamitHota</text>
    <text x="44" y="122" font-size="15" fill="#00ff41" opacity="0.62">// security engineer &#183; software developer &#183; automator</text>

    <line x1="40" y1="142" x2="960" y2="142" stroke="#00ff41" stroke-width="1" opacity="0.22"/>

    <!-- ── typed terminal body ── -->
    <g font-size="16" filter="url(#softglow)">
      <g clip-path="url(#t1)">
        <text x="40" y="178" fill="#00ff41" opacity="0.55">root@github:~#</text>
        <text x="188" y="178" fill="#e6ffe6">./whoami --verbose</text>
      </g>
      <g clip-path="url(#t2)">
        <text x="40" y="212" fill="#00ff41">&#8250;</text>
        <text x="62" y="212" fill="#9be89b">breaking things so attackers can't</text>
      </g>
      <g clip-path="url(#t3)">
        <text x="40" y="246" fill="#00ff41" opacity="0.55">root@github:~#</text>
        <text x="188" y="246" fill="#e6ffe6">./status --live</text>
      </g>
      <g clip-path="url(#t4)">
        <text x="40" y="280" fill="#00ff41">&#8250;</text>
        <text x="62" y="280" fill="#9be89b">[ONLINE] trust nothing &#183; verify everything &#183; automate the rest</text>
      </g>
    </g>

    <!-- block cursor: appears after the last line lands, then blinks -->
    <rect x="672" y="266" width="10" height="18" fill="#00ff41">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0" keyTimes="0;0.66;0.70;0.74;0.78;0.82;0.86;0.90;0.94;1" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ── CRT texture over the content ── -->
  <rect width="1000" height="340" fill="url(#crt)" opacity="0.85" style="mix-blend-mode:screen"/>

  <!-- ── the scanner: sweeps top to bottom, forever ── -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -110; 0 350" dur="3.6s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="1000" height="100" fill="url(#scanGlow)"/>
    <rect x="0" y="100" width="1000" height="2" fill="#00ff41" opacity="0.85"/>
    <rect x="0" y="102" width="1000" height="1" fill="#aaffc3" opacity="0.5"/>
  </g>

  <!-- ── frame + corner brackets ── -->
  <rect x="0.5" y="0.5" width="999" height="339" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.35"/>
  <g stroke="#00ff41" stroke-width="2" fill="none" opacity="0.9">
    <polyline points="10,30 10,10 30,10"/>
    <polyline points="970,10 990,10 990,30"/>
    <polyline points="10,310 10,330 30,330"/>
    <polyline points="970,330 990,330 990,310"/>
  </g>
</svg>
