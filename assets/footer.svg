<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="session terminated">
  <defs>
    <pattern id="crt3" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect width="4" height="1" fill="#00ff41" opacity="0.05"/>
    </pattern>
    <linearGradient id="scanGlow3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#00ff41" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.32"/>
    </linearGradient>
    <filter id="sg3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="190" fill="#000000"/>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="15" filter="url(#sg3)">
    <text x="40" y="46"><tspan fill="#00ff41" opacity="0.55">root@github:~#</tspan><tspan fill="#e6ffe6"> echo $SIGNATURE</tspan></text>
    <text x="40" y="76" fill="#9be89b">"Security is not a product. It is a process &#8212; and I automate processes."</text>
    <text x="40" y="116"><tspan fill="#00ff41" opacity="0.55">root@github:~#</tspan><tspan fill="#e6ffe6"> exit</tspan></text>
    <text x="40" y="146" fill="#4d8060">[*] connection closed by remote host.</text>
    <text x="40" y="170"><tspan fill="#4d8060">[*] session terminated. see you next boot. </tspan><tspan fill="#00ff41">&#9608;<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <rect width="1000" height="190" fill="url(#crt3)" opacity="0.85" style="mix-blend-mode:screen"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -100; 0 200" dur="3.6s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="1000" height="90" fill="url(#scanGlow3)"/>
    <rect x="0" y="90" width="1000" height="2" fill="#00ff41" opacity="0.8"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="189" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.3"/>
</svg>
