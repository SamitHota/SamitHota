<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#00ff41" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#aaffc3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="12" fill="#000000"/>
  <line x1="0" y1="6" x2="1000" y2="6" stroke="#00ff41" stroke-width="1" opacity="0.2"/>

  <!-- travelling pulse -->
  <g filter="url(#dglow)">
    <rect x="-260" y="5" width="260" height="2" fill="url(#pulse)">
      <animate attributeName="x" values="-260;1000" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
